name: seyir
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.4
  get: ^4.7.2
  dio: ^5.8.0
  lottie: ^3.2.0
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.1
  http: ^1.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  ionicons: ^0.2.2
  flutter_html: ^3.0.0-beta.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  google_maps_flutter: ^2.12.2
  permission_handler: ^11.0.0
  device_info_plus: ^10.1.0


  # maps_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
  #  - assets/welcome.json
   - assets/logo.png
   - assets/seyir/nav_logo_light.png
   - assets/seyir/nav_logo_dark.png
   - assets/delivery_icon.png
   - assets/delivery_icon_white.png
   - assets/no-image.jpg
   - assets/category/
   - assets/seyir/
  fonts:
    - family: Bricolage
      fonts:
        - asset: fonts/static/BricolageGrotesque_24pt-Medium.ttf
        - asset: fonts/static/BricolageGrotesque_24pt-Light.ttf
        - asset: fonts/static/BricolageGrotesque_24pt-Bold.ttf
          style: italic